<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — CampusConnect(UTB)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--gray-50); }
    .notfound { text-align:center; max-width:480px; padding:40px 20px; }
    .notfound-code { font-size:8rem; font-weight:800; color:var(--gray-200); line-height:1; font-family:'Plus Jakarta Sans',sans-serif; }
    .notfound-icon { font-size:3rem; margin:-20px 0 20px; }
    .notfound h1 { font-size:1.5rem; font-weight:800; margin-bottom:12px; }
    .notfound p  { color:var(--gray-400); margin-bottom:32px; }
    .notfound-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="notfound">
    <div class="notfound-code">404</div>
    <div class="notfound-icon">🔍</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="notfound-actions">
      <a href="index.html" class="btn btn-primary btn-lg">🏠 Go Home</a>
      <button onclick="history.back()" class="btn btn-ghost btn-lg">← Go Back</button>
    </div>
  </div>
</body>
</html>
